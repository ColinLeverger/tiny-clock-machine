# Deploy the static site to GitHub Pages on every push to main.
# Settings -> Pages -> Source: "GitHub Actions" to enable this.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/clock.test.js && node tests/sync.test.js
      # Stamp the worker with the commit SHA so every deploy is a new cache.
      - name: Stamp release version
        run: sed -i "s/^var VERSION = .*/var VERSION = \"tcm-${{ github.sha }}\";/" sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
